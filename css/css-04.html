<!DOCTYPE html>
<html>
<head>
    <title>CSS 04 - Fonts</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        h1 {
            font-family: Georgia;
            font-size: 45px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 3px 3px 10px #ff5ca8;
        }

        p {
            font-size: 20px;
            line-height: 2;
            text-decoration: underline;
            text-align: justify;
        }
    </style>
</head>

<body>

    <h1>Font Properties</h1>

    <p>
        This paragraph demonstrates font size, font family,
        font weight, text alignment, line height and text decoration.
    </p>

</body>
</html>
