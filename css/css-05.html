<!DOCTYPE html>
<html>
<head>
    <title>CSS 05 - Box Model</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .box {
            width: 300px;

            /* Content */
            background: #4f8cff;

            /* Padding */
            padding: 40px;

            /* Border */
            border: 10px solid #ff5ca8;

            /* Margin */
            margin: 50px auto;

            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        Content Area
    </div>

</body>
</html>
