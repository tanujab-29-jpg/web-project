<!DOCTYPE html>
<html>
<head>
    <title>CSS 06 - Sizing</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        .box1 {
            width: 50%;
            height: 100px;
            background: #4f8cff;
            padding: 20px;
        }

        .box2 {
            width: 300px;
            min-width: 200px;
            max-width: 500px;
            height: 150px;
            background: #ff5ca8;
            margin-top: 20px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Width and Height</h1>

    <div class="box1">
        Width: 50%, Height: 100px
    </div>

    <div class="box2">
        Fixed width with min-width and max-width.
    </div>

</body>
</html>
