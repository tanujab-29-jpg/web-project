<!DOCTYPE html>
<html>
<head>
    <title>CSS 07 - Positioning</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            min-height: 1000px;
        }

        .container {
            position: relative;
            height: 400px;
            border: 2px solid #4f8cff;
            margin: 30px;
        }

        .static {
            position: static;
        }

        .relative {
            position: relative;
            left: 50px;
        }

        .absolute {
            position: absolute;
            right: 20px;
            top: 100px;
        }

        .fixed {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #ff5ca8;
            padding: 15px;
        }

        .sticky {
            position: sticky;
            top: 0;
            background: #4f8cff;
            padding: 15px;
        }

        div {
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="sticky">
        Sticky Element
    </div>

    <div class="container">

        <div class="static">Static</div>

        <div class="relative">Relative</div>

        <div class="absolute">Absolute</div>

    </div>

    <div class="fixed">
        Fixed
    </div>

</body>
</html>
