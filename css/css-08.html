<!DOCTYPE html>
<html>
<head>
    <title>CSS 08 - Float</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 30px;
        }

        .image {
            width: 200px;
            height: 150px;
            background: #4f8cff;
            float: left;
            margin-right: 20px;
            display: grid;
            place-items: center;
        }

        .clear {
            clear: both;
            background: #ff5ca8;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="image">
        FLOAT
    </div>

    <p>
        This text flows around the floated element.
        Float is commonly used for wrapping content around images.
    </p>

    <div class="clear">
        This element uses clear: both.
    </div>

</body>
</html>
