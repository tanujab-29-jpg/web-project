<!DOCTYPE html>
<html>
<head>
    <title>CSS 09 - Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
        }

        nav {
            background: #101f38;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 35px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 10px;
        }

        nav a:hover {
            background: #ff5ca8;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
