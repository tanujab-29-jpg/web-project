<!DOCTYPE html>
<html>
<head>
    <title>CSS 11 - Pseudo Elements</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
        }

        p::before {
            content: "★ ";
            color: #4f8cff;
        }

        p::after {
            content: " ✓";
            color: #ff5ca8;
        }

        p::first-letter {
            font-size: 50px;
            color: #ff5ca8;
        }

        p::first-line {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Pseudo Elements</h1>

    <p>
        This paragraph demonstrates CSS pseudo-elements.
        The first letter, first line, before and after elements
        are styled using CSS.
    </p>

</body>
</html>
