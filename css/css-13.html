<!DOCTYPE html>
<html>
<head>
    <title>CSS 13 - Registration Form</title>

    <style>
        body {
            background: linear-gradient(135deg, #07111f, #172b4d);
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .form {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #4f8cff;
            border-radius: 8px;
            background: #101f38;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg,#4f8cff,#ff5ca8);
            color: white;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <form class="form">

        <h1>Registration Form</h1>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <label>Date of Birth</label>
        <input type="date">

        <label>Course</label>
        <select>
            <option>Select Course</option>
            <option>B.Tech CSE</option>
            <option>B.Tech ECE</option>
            <option>BCA</option>
        </select>

        <label>Address</label>
        <textarea rows="4"></textarea>

        <button type="submit">Register</button>

    </form>

</body>
</html>
