<!DOCTYPE html>
<html>
<head>
    <title>CSS 17 - Transitions</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 50px;
        }

        .box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg,#4f8cff,#ff5ca8);
            border-radius: 20px;
            display: grid;
            place-items: center;

            transition: all 0.6s ease;
        }

        .box:hover {
            transform: translateY(-20px)
                       rotate(10deg)
                       scale(1.1);

            border-radius: 50%;
        }
    </style>
</head>

<body>

    <h1>Hover Over the Box</h1>

    <div class="box">
        Hover Me
    </div>

</body>
</html>
