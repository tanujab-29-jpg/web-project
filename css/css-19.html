<!DOCTYPE html>
<html>
<head>
    <title>CSS 19 - Responsive Navigation</title>

    <style>
        body {
            margin: 0;
            background: #07111f;
            font-family: Arial;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            background: #101f38;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
        }

        nav a:hover {
            background: #ff5ca8;
            border-radius: 8px;
        }

        @media(max-width:600px) {

            nav {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
