<!DOCTYPE html>
<html>
<head>
    <title>CSS 25 - Homepage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial;
            background: #07111f;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 20px 8%;
            background: #101f38;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 500px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 30px;
            background:
                linear-gradient(#07111dcc,#07111dcc),
                url("https://picsum.photos/1600/700");
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            font-size: 55px;
        }

        .hero button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg,#4f8cff,#ff5ca8);
            color: white;
        }

        .services {
            padding: 60px 8%;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .card {
            background: #101f38;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #101f38;
        }

        @media(max-width:700px) {
            .services {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyWebsite</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">

        <div>
            <h1>Welcome to My Website</h1>
            <p>Beautiful responsive website using HTML and CSS.</p>
            <br>
            <button>Explore Now</button>
        </div>

    </section>

    <section class="services">

        <div class="card">
            <h2>Web Design</h2>
            <p>Modern and responsive websites.</p>
        </div>

        <div class="card">
            <h2>Development</h2>
            <p>Clean and efficient code.</p>
        </div>

        <div class="card">
            <h2>Support</h2>
            <p>Professional technical support.</p>
        </div>

    </section>

    <footer>
        © 2026 MyWebsite
    </footer>

</body>
</html>
