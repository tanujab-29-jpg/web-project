<!DOCTYPE html>
<html>
<head>
    <title>CSS 31 - Gradients</title>
    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .box {
            width: 300px;
            height: 200px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: bold;
        }

        .linear {
            background: linear-gradient(135deg, #4f8cff, #ff5ca8);
        }

        .radial {
            background: radial-gradient(circle, #ff5ca8, #4f8cff, #07111f);
        }
    </style>
</head>
<body>

<h1>CSS Gradients</h1>

<div class="container">
    <div class="box linear">Linear Gradient</div>
    <div class="box radial">Radial Gradient</div>
</div>

</body>
</html>
