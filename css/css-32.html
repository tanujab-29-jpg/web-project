<!DOCTYPE html>
<html>
<head>
    <title>CSS 32 - Shadows</title>
    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 50px;
            text-align: center;
        }

        h1 {
            color: #4f8cff;
            text-shadow: 4px 4px 10px #ff5ca8;
        }

        .card {
            max-width: 400px;
            margin: 50px auto;
            padding: 50px;
            background: #101f38;
            border-radius: 20px;
            box-shadow: 0 20px 40px #000;
        }

        .card h2 {
            text-shadow: 3px 3px 8px #4f8cff;
        }
    </style>
</head>
<body>

<h1>CSS Shadows</h1>

<div class="card">
    <h2>Box Shadow</h2>
    <p>This card demonstrates box-shadow.</p>
    <p>The heading demonstrates text-shadow.</p>
</div>

</body>
</html>
