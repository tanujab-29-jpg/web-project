<!DOCTYPE html>
<html>
<head>
    <title>CSS 33 - Border Radius</title>
    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .shape {
            width: 150px;
            height: 150px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #4f8cff, #ff5ca8);
        }

        .square {
            border-radius: 0;
        }

        .rounded {
            border-radius: 30px;
        }

        .circle {
            border-radius: 50%;
        }

        .pill {
            width: 250px;
            border-radius: 100px;
        }
    </style>
</head>
<body>

<h1>Border Radius Shapes</h1>

<div class="container">
    <div class="shape square">Square</div>
    <div class="shape rounded">Rounded</div>
    <div class="shape circle">Circle</div>
    <div class="shape pill">Pill</div>
</div>

</body>
</html>
