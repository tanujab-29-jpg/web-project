<!DOCTYPE html>
<html>
<head>
    <title>CSS 34 - Opacity</title>
    <style>
        body {
            background: linear-gradient(135deg, #07111f, #172b4d);
            color: white;
            font-family: Arial;
            padding: 40px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 200px;
            height: 150px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #4f8cff;
            font-size: 20px;
        }

        .full {
            opacity: 1;
        }

        .medium {
            opacity: 0.5;
        }

        .low {
            opacity: 0.2;
        }

        .transparent {
            background: rgba(255, 92, 168, 0.3);
        }
    </style>
</head>
<body>

<h1>Opacity and Transparency</h1>

<div class="container">
    <div class="box full">Opacity 1</div>
    <div class="box medium">Opacity 0.5</div>
    <div class="box low">Opacity 0.2</div>
    <div class="box transparent">RGBA</div>
</div>

</body>
</html>
