<!DOCTYPE html>
<html>
<head>
    <title>CSS 37 - Display Properties</title>
    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .block {
            display: block;
            background: #4f8cff;
            padding: 20px;
            margin: 10px;
        }

        .inline {
            display: inline;
            background: #ff5ca8;
            padding: 15px;
        }

        .inline-block {
            display: inline-block;
            background: purple;
            padding: 25px;
            margin: 10px;
        }

        .none {
            display: none;
        }
    </style>
</head>
<body>

<h1>CSS Display Properties</h1>

<div class="block">Block Element</div>

<span class="inline">Inline Element</span>
<span class="inline">Inline Element</span>

<br><br>

<div class="inline-block">Inline-Block 1</div>
<div class="inline-block">Inline-Block 2</div>

<div class="none">
    This element has display: none.
</div>

</body>
</html>
