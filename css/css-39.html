<!DOCTYPE html>
<html>
<head>
    <title>CSS 39 - Dropdown Menu</title>
    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial;
        }

        nav {
            background: #101f38;
            padding: 20px;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px;
        }

        .dropdown {
            position: relative;
        }

        .menu {
            display: none;
            position: absolute;
            top: 45px;
            left: 0;
            width: 180px;
            background: #101f38;
            border: 1px solid #4f8cff;
            border-radius: 10px;
            padding: 10px;
        }

        .menu a {
            display: block;
            padding: 12px;
        }

        .menu a:hover {
            background: #ff5ca8;
            border-radius: 8px;
        }

        .dropdown:hover .menu {
            display: block;
        }
    </style>
</head>
<body>

<nav>

    <a href="#">Home</a>

    <div class="dropdown">
        <a href="#">Courses ▼</a>

        <div class="menu">
            <a href="#">HTML</a>
            <a href="#">CSS</a>
            <a href="#">JavaScript</a>
            <a href="#">Python</a>
        </div>
    </div>

    <a href="#">About</a>
    <a href="#">Contact</a>

</nav>

<h1 style="padding:40px;">CSS Dropdown Menu</h1>

</body>
</html>
