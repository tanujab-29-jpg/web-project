<!DOCTYPE html>
<html>
<head>
    <title>CSS 44 - Object Fit</title>
    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            background: #101f38;
            padding: 15px;
            border-radius: 15px;
        }

        img {
            width: 100%;
            height: 180px;
            border-radius: 10px;
        }

        .cover {
            object-fit: cover;
        }

        .contain {
            object-fit: contain;
            background: #172b4d;
        }

        .top {
            object-fit: cover;
            object-position: top;
        }
    </style>
</head>
<body>

<h1>Object-Fit and Object-Position</h1>

<div class="container">

    <div class="card">
        <h3>Cover</h3>
        <img class="cover" src="https://picsum.photos/500/300?10">
    </div>

    <div class="card">
        <h3>Contain</h3>
        <img class="contain" src="https://picsum.photos/500/300?11">
    </div>

    <div class="card">
        <h3>Position Top</h3>
        <img class="top" src="https://picsum.photos/500/300?12">
    </div>

</div>

</body>
</html>
