<!DOCTYPE html>
<html>
<head>
    <title>CSS 45 - Responsive Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #07111f;
            color: white;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 18px;
            transition: 0.4s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="gallery">
    <img src="https://picsum.photos/600/400?21">
    <img src="https://picsum.photos/600/400?22">
    <img src="https://picsum.photos/600/400?23">
    <img src="https://picsum.photos/600/400?24">
    <img src="https://picsum.photos/600/400?25">
    <img src="https://picsum.photos/600/400?26">
    <img src="https://picsum.photos/600/400?27">
    <img src="https://picsum.photos/600/400?28">
</div>

</body>
</html>
