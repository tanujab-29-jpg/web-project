<!DOCTYPE html>
<html>
<head>
    <title>CSS 46 - Flexbox Cards</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #07111f;
            color: white;
            font-family: Arial;
        }

        h1 {
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .card {
            width: 250px;
            padding: 30px;
            background: #101f38;
            border-radius: 20px;
            text-align: center;
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px #0008;
        }

        .icon {
            font-size: 50px;
            color: #4f8cff;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4f8cff, #ff5ca8);
            color: white;
        }
    </style>
</head>
<body>

<h1>Flexbox Card Layout</h1>

<div class="cards">

    <div class="card">
        <div class="icon">💻</div>
        <h2>Web Design</h2>
        <p>Modern website designs.</p>
        <button>Learn More</button>
    </div>

    <div class="card">
        <div class="icon">📱</div>
        <h2>Responsive</h2>
        <p>Mobile-friendly layouts.</p>
        <button>Learn More</button>
    </div>

    <div class="card">
        <div class="icon">⚡</div>
        <h2>Performance</h2>
        <p>Fast and efficient websites.</p>
        <button>Learn More</button>
    </div>

</div>

</body>
</html>
