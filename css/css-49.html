<!DOCTYPE html>
<html>
<head>
    <title>CSS 49 - Three Column Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background: #07111f;
            color: white;
            font-family: Arial;
        }

        h1 {
            text-align: center;
        }

        .columns {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .column {
            flex: 1;
            padding: 35px;
            background: #101f38;
            border-radius: 20px;
            text-align: center;
        }

        .column:nth-child(1) {
            border-top: 5px solid #4f8cff;
        }

        .column:nth-child(2) {
            border-top: 5px solid #ff5ca8;
        }

        .column:nth-child(3) {
            border-top: 5px solid #8c52ff;
        }

        @media (max-width: 700px) {
            .columns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<h1>Three Column Layout</h1>

<div class="columns">

    <div class="column">
        <h2>Column 1</h2>
        <p>HTML and web structure.</p>
    </div>

    <div class="column">
        <h2>Column 2</h2>
        <p>CSS and web styling.</p>
    </div>

    <div class="column">
        <h2>Column 3</h2>
        <p>JavaScript programming.</p>
    </div>

</div>

</body>
</html>
