<!DOCTYPE html>
<html>
<head>
    <title>CSS 54 - Contact Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .info,
        form {
            background: #101f38;
            padding: 35px;
            border-radius: 20px;
        }

        h1,
        h2 {
            color: #4f8cff;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin: 8px 0 18px;
            border: 1px solid #4f8cff;
            border-radius: 10px;
            background: #07111f;
            color: white;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4f8cff, #ff5ca8);
            color: white;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<h1 style="text-align:center;">Contact Us</h1>

<div class="container">

    <div class="info">
        <h2>Get in Touch</h2>
        <p>Have questions? Contact us using the form.</p>
        <p><b>Email:</b> student@example.com</p>
        <p><b>Phone:</b> 9876543210</p>
        <p><b>Address:</b> Chennai, Tamil Nadu</p>
    </div>

    <form>
        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Message</label>
        <textarea rows="6" placeholder="Enter your message"></textarea>

        <button type="submit">Send Message</button>
    </form>

</div>

</body>
</html>
