<!DOCTYPE html>
<html>
<head>
    <title>CSS 57 - Online Shopping</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial;
        }

        header {
            padding: 20px 8%;
            background: #101f38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #4f8cff;
        }

        .products {
            padding: 50px 8%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            background: #101f38;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: .4s;
        }

        .product:hover {
            transform: translateY(-8px);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
        }

        .price {
            color: #ff5ca8;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4f8cff, #ff5ca8);
            color: white;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>ShopNow</h2>
    <div>🛒 Cart</div>
</header>

<section class="products">

    <div class="product">
        <img src="https://picsum.photos/400/300?31">
        <h2>Smart Watch</h2>
        <p class="price">₹2,999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/400/300?32">
        <h2>Headphones</h2>
        <p class="price">₹1,999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/400/300?33">
        <h2>Backpack</h2>
        <p class="price">₹1,299</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/400/300?34">
        <h2>Sunglasses</h2>
        <p class="price">₹999</p>
        <button>Buy Now</button>
    </div>

</section>

</body>
</html>
