<!DOCTYPE html>
<html>
<head>
    <title>CSS 65 - Transitions</title>
    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 50px;
            text-align: center;
        }

        .box {
            width: 200px;
            height: 200px;
            margin: 50px auto;
            display: grid;
            place-items: center;
            background: #4f8cff;
            border-radius: 20px;
            transition:
                background 0.5s,
                transform 0.5s,
                border-radius 0.5s,
                width 0.5s;
        }

        .box:hover {
            background: #ff5ca8;
            transform: rotate(10deg) scale(1.15);
            border-radius: 50%;
            width: 250px;
        }
    </style>
</head>
<body>

<h1>CSS Transition</h1>

<div class="box">
    Hover Me
</div>

</body>
</html>
