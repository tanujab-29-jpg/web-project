<!DOCTYPE html>
<html>
<head>
    <title>CSS 71 - Dark Mode</title>

    <style>
        :root {
            --bg: #07111f;
            --text: white;
            --card: #101f38;
            --accent: #4f8cff;
            --pink: #ff5ca8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: 0.4s;
        }

        #theme {
            display: none;
        }

        #theme:checked ~ .page {
            --bg: #f5f5f5;
            --text: #07111f;
            --card: white;
            --accent: #315dcc;
            --pink: #e83e8c;
        }

        .page {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            padding: 30px;
            transition: 0.4s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card);
            border-radius: 15px;
        }

        h1 {
            color: var(--accent);
        }

        .toggle {
            background: var(--pink);
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            color: white;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 15px;
            flex: 1;
            min-width: 220px;
        }
    </style>
</head>

<body>

<input type="checkbox" id="theme">

<div class="page">

    <header>
        <h1>Dark Mode Website</h1>

        <label for="theme" class="toggle">
            Toggle Theme
        </label>
    </header>

    <div class="cards">

        <div class="card">
            <h2>CSS Variables</h2>
            <p>Colors are controlled using CSS custom properties.</p>
        </div>

        <div class="card">
            <h2>Dark Mode</h2>
            <p>The theme can be changed using CSS variables.</p>
        </div>

        <div class="card">
            <h2>Responsive</h2>
            <p>The layout works on different screen sizes.</p>
        </div>

    </div>

</div>

</body>
</html>
