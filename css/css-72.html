<!DOCTYPE html>
<html>
<head>
    <title>CSS 72 - Responsive Typography</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: #101f38;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 5rem);
            color: #4f8cff;
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 3rem);
            color: #ff5ca8;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.4rem);
            line-height: 1.7;
        }

        .box {
            margin-top: 30px;
            padding: 25px;
            border: 2px solid #4f8cff;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Responsive Typography</h1>

    <h2>CSS Font Scaling</h2>

    <p>
        This webpage demonstrates responsive typography.
        The font sizes automatically adjust according to
        the screen width.
    </p>

    <div class="box">
        <h2>Resize Your Browser</h2>
        <p>
            The text changes size smoothly on different devices.
        </p>
    </div>

</div>

</body>
</html>
