<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Marks</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>HTML</th>
            <th>CSS</th>
        </tr>

        <tr>
            <td>Tanuja</td>
            <td>85</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>80</td>
            <td>88</td>
        </tr>

        <tr>
            <td colspan="3">End of Table</td>
        </tr>
    </table>

</body>
</html>
