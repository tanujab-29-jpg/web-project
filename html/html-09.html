<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types</title>
</head>
<body>

    <h1>HTML5 Input Types</h1>

    <form>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Age:</label>
        <input type="number" min="1" max="100">
        <br><br>

        <label>Password:</label>
        <input type="password">
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
