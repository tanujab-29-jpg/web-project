<!DOCTYPE html>
<html>
<head>
    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Styling</h1>

    <p>This paragraph uses internal CSS.</p>

    <button class="external-button">
        External CSS Button
    </button>

</body>
</html>.external-button {
    background-color: blue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
}
