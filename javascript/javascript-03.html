<!DOCTYPE html>
<html>
<head>
    <title>Largest of Three Numbers</title>
</head>
<body>

<h2>Largest of Three Numbers</h2>

<script>
    let a = 25;
    let b = 45;
    let c = 35;

    let largest;

    if (a >= b && a >= c) {
        largest = a;
    } else if (b >= a && b >= c) {
        largest = b;
    } else {
        largest = c;
    }

    document.write("Largest number = " + largest);
</script>

</body>
</html>
