<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative Zero</title>
</head>
<body>

<h2>Check Number</h2>

<script>
    let number = -10;

    if (number > 0) {
        document.write("Positive number");
    } else if (number < 0) {
        document.write("Negative number");
    } else {
        document.write("Zero");
    }
</script>

</body>
</html>
