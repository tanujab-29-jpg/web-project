<!DOCTYPE html>
<html>
<head>
    <title>Factorial</title>
</head>
<body>

<h2>Factorial of a Number</h2>

<script>
    let number = 5;
    let factorial = 1;

    for (let i = 1; i <= number; i++) {
        factorial *= i;
    }

    document.write("Factorial of " + number + " = " + factorial);
</script>

</body>
</html>
