<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>
<body>

<h2>Fibonacci Series</h2>

<script>
    let n = 10;
    let a = 0;
    let b = 1;

    document.write(a + " " + b + " ");

    for (let i = 2; i < n; i++) {
        let c = a + b;
        document.write(c + " ");

        a = b;
        b = c;
    }
</script>

</body>
</html>
