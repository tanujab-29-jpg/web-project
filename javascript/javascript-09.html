<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Number</title>
</head>
<body>

<h2>Palindrome Check</h2>

<script>
    let number = 121;
    let original = number;
    let reverse = 0;

    while (number > 0) {
        let digit = number % 10;
        reverse = reverse * 10 + digit;
        number = Math.floor(number / 10);
    }

    if (original === reverse) {
        document.write(original + " is a Palindrome");
    } else {
        document.write(original + " is not a Palindrome");
    }
</script>

</body>
</html>
