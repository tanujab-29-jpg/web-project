<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .gender {
            margin-top: 8px;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .error {
            color: red;
            font-size: 13px;
            display: block;
            margin-top: 3px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        #success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>College Admission Form</h2>

    <form id="admissionForm">

        <label>Full Name</label>
        <input type="text" id="name">
        <span class="error" id="nameError"></span>

        <label>Email</label>
        <input type="text" id="email">
        <span class="error" id="emailError"></span>

        <label>Phone Number</label>
        <input type="text" id="phone">
        <span class="error" id="phoneError"></span>

        <label>Date of Birth</label>
        <input type="date" id="dob">
        <span class="error" id="dobError"></span>

        <label>Gender</label>

        <div class="gender">
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
        </div>

        <span class="error" id="genderError"></span>

        <label>Select Course</label>
        <select id="course">
            <option value="">-- Select Course --</option>
            <option value="B.Tech CSE">B.Tech CSE</option>
            <option value="B.Tech ECE">B.Tech ECE</option>
            <option value="B.Tech EEE">B.Tech EEE</option>
            <option value="B.Sc Computer Science">B.Sc Computer Science</option>
            <option value="BBA">BBA</option>
        </select>

        <span class="error" id="courseError"></span>

        <label>12th Percentage</label>
        <input type="number" id="percentage" min="0" max="100">
        <span class="error" id="percentageError"></span>

        <label>Address</label>
        <textarea id="address" rows="4"></textarea>
        <span class="error" id="addressError"></span>

        <button type="submit">Submit Admission Form</button>

        <p id="success"></p>

    </form>

</div>

<script>

document.getElementById("admissionForm").addEventListener("submit", function(event) {

    event.preventDefault();

    // Get values
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let dob = document.getElementById("dob").value;
    let course = document.getElementById("course").value;
    let percentage = document.getElementById("percentage").value;
    let address = document.getElementById("address").value.trim();

    let gender = document.querySelector('input[name="gender"]:checked');

    // Clear previous errors
    document.querySelectorAll(".error").forEach(function(error) {
        error.textContent = "";
    });

    document.getElementById("success").textContent = "";

    let valid = true;

    // Name validation
    let namePattern = /^[A-Za-z ]+$/;

    if (name === "") {
        document.getElementById("nameError").textContent =
            "Name is required.";
        valid = false;
    } 
    else if (!namePattern.test(name)) {
        document.getElementById("nameError").textContent =
            "Name should contain only letters.";
        valid = false;
    }

    // Email validation
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {
        document.getElementById("emailError").textContent =
            "Email is required.";
        valid = false;
    }
    else if (!emailPattern.test(email)) {
        document.getElementById("emailError").textContent =
            "Enter a valid email address.";
        valid = false;
    }

    // Phone validation
    let phonePattern = /^[0-9]{10}$/;

    if (phone === "") {
        document.getElementById("phoneError").textContent =
            "Phone number is required.";
        valid = false;
    }
    else if (!phonePattern.test(phone)) {
        document.getElementById("phoneError").textContent =
            "Phone number must contain exactly 10 digits.";
        valid = false;
    }

    // DOB validation
    if (dob === "") {
        document.getElementById("dobError").textContent =
            "Date of birth is required.";
        valid = false;
    }

    // Gender validation
    if (!gender) {
        document.getElementById("genderError").textContent =
            "Please select your gender.";
        valid = false;
    }

    // Course validation
    if (course === "") {
        document.getElementById("courseError").textContent =
            "Please select a course.";
        valid = false;
    }

    // Percentage validation
    if (percentage === "") {
        document.getElementById("percentageError").textContent =
            "12th percentage is required.";
        valid = false;
    }
    else if (percentage < 0 || percentage > 100) {
        document.getElementById("percentageError").textContent =
            "Percentage must be between 0 and 100.";
        valid = false;
    }

    // Address validation
    if (address === "") {
        document.getElementById("addressError").textContent =
            "Address is required.";
        valid = false;
    }
    else if (address.length < 10) {
        document.getElementById("addressError").textContent =
            "Address must contain at least 10 characters.";
        valid = false;
    }

    // Final result
    if (valid) {

        document.getElementById("success").textContent =
            "Admission form submitted successfully!";

        document.getElementById("admissionForm").reset();
    }

});

</script>

</body>
</html>
