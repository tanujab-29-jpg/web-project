<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 40px;
        }

        .container {
            width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        .info {
            padding: 12px;
            margin: 8px 0;
            background: #eef4ff;
            border-radius: 5px;
        }

        .label {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Navigator Object</h2>

    <div class="info">
        <span class="label">Browser Information:</span>
        <span id="browser"></span>
    </div>

    <div class="info">
        <span class="label">Platform:</span>
        <span id="platform"></span>
    </div>

    <div class="info">
        <span class="label">Language:</span>
        <span id="language"></span>
    </div>

    <div class="info">
        <span class="label">Cookies Enabled:</span>
        <span id="cookies"></span>
    </div>

    <div class="info">
        <span class="label">Online Status:</span>
        <span id="online"></span>
    </div>

    <div class="info">
        <span class="label">Number of CPU Cores:</span>
        <span id="cores"></span>
    </div>

</div>

<script>

document.getElementById("browser").textContent =
    navigator.userAgent;

document.getElementById("platform").textContent =
    navigator.platform;

document.getElementById("language").textContent =
    navigator.language;

document.getElementById("cookies").textContent =
    navigator.cookieEnabled ? "Enabled" : "Disabled";

document.getElementById("online").textContent =
    navigator.onLine ? "Online" : "Offline";

document.getElementById("cores").textContent =
    navigator.hardwareConcurrency;

</script>

</body>
</html>
