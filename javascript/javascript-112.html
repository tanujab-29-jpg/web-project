<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 40px;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        #output {
            margin: 20px 0;
            padding: 15px;
            background: #eef4ff;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 8px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>History Object</h2>

    <div id="output">
        Number of pages in history:
        <span id="length"></span>
    </div>

    <button onclick="goBack()">Go Back</button>

    <button onclick="goForward()">Go Forward</button>

    <button onclick="goBackTwo()">Go Back 2 Pages</button>

    <button onclick="showHistory()">Show History Length</button>

</div>

<script>

function showHistory() {

    document.getElementById("length").textContent =
        window.history.length;
}


// Go to previous page
function goBack() {
    history.back();
}


// Go to next page
function goForward() {
    history.forward();
}


// Go back two pages
function goBackTwo() {
    history.go(-2);
}


// Display history length
function showHistory() {

    document.getElementById("output").innerHTML =
        "Number of pages in browser history: " +
        history.length;
}


// Display initial history length
showHistory();

</script>

</body>
</html>
