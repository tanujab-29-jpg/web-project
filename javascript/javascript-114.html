<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sessionStorage Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 40px;
            text-align: center;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #eef4ff;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>sessionStorage Example</h2>

    <input
        type="text"
        id="username"
        placeholder="Enter your name"
    >

    <br>

    <button onclick="saveData()">
        Save Data
    </button>

    <button onclick="getData()">
        Get Data
    </button>

    <button onclick="removeData()">
        Remove Data
    </button>

    <button onclick="clearData()">
        Clear Storage
    </button>

    <div id="output"></div>

</div>

<script>

function saveData() {

    let name = document.getElementById("username").value;

    if (name === "") {
        document.getElementById("output").textContent =
            "Please enter your name.";
        return;
    }

    // Store data in sessionStorage
    sessionStorage.setItem("username", name);

    document.getElementById("output").textContent =
        "Data saved in sessionStorage!";
}


function getData() {

    // Retrieve data from sessionStorage
    let name = sessionStorage.getItem("username");

    if (name) {
        document.getElementById("output").textContent =
            "Stored Name: " + name;
    } else {
        document.getElementById("output").textContent =
            "No data found.";
    }
}


function removeData() {

    // Remove one item
    sessionStorage.removeItem("username");

    document.getElementById("output").textContent =
        "Username removed from sessionStorage.";
}


function clearData() {

    // Remove all sessionStorage data
    sessionStorage.clear();

    document.getElementById("output").textContent =
        "All sessionStorage data has been cleared.";
}

</script>

</body>
</html>
