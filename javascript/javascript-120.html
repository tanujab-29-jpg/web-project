<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .timer-container {
            background: white;
            width: 350px;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        input {
            width: 80%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #display {
            font-size: 45px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            font-family: monospace;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #startBtn {
            background: #28a745;
        }

        #pauseBtn {
            background: #ffc107;
            color: black;
        }

        #resetBtn {
            background: #007bff;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="timer-container">

        <h1>Countdown Timer</h1>

        <input
            type="number"
            id="secondsInput"
            placeholder="Enter seconds"
            min="1"
        >

        <div id="display">00:00:00</div>

        <button id="startBtn" onclick="startTimer()">Start</button>

        <button id="pauseBtn" onclick="pauseTimer()">Pause</button>

        <button id="resetBtn" onclick="resetTimer()">Reset</button>

        <div id="message"></div>

    </div>

    <script>

        let timeLeft = 0;
        let timer = null;

        function formatTime(seconds) {

            let hours = Math.floor(seconds / 3600);

            let minutes = Math.floor((seconds % 3600) / 60);

            let secs = seconds % 60;

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            secs = String(secs).padStart(2, "0");

            return `${hours}:${minutes}:${secs}`;
        }

        function updateDisplay() {

            document.getElementById("display").textContent =
                formatTime(timeLeft);
        }

        function startTimer() {

            if (timer !== null) {
                return;
            }

            if (timeLeft === 0) {

                let inputValue =
                    parseInt(document.getElementById("secondsInput").value);

                if (isNaN(inputValue) || inputValue <= 0) {

                    document.getElementById("message").textContent =
                        "Please enter a valid number of seconds.";

                    return;
                }

                timeLeft = inputValue;

                document.getElementById("message").textContent = "";
            }

            timer = setInterval(function () {

                if (timeLeft > 0) {

                    timeLeft--;

                    updateDisplay();

                } else {

                    clearInterval(timer);

                    timer = null;

                    document.getElementById("message").textContent =
                        "Time's Up!";

                    alert("Countdown finished!");
                }

            }, 1000);
        }

        function pauseTimer() {

            if (timer !== null) {

                clearInterval(timer);

                timer = null;

                document.getElementById("message").textContent =
                    "Timer Paused";
            }
        }

        function resetTimer() {

            clearInterval(timer);

            timer = null;

            timeLeft = 0;

            updateDisplay();

            document.getElementById("secondsInput").value = "";

            document.getElementById("message").textContent = "";
        }

    </script>

</body>
</html>
