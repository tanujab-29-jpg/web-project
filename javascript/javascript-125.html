<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            background: white;
            width: 350px;
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 300px;
            margin: 0 auto 25px;
        }

        .cell {
            width: 95px;
            height: 95px;
            border: none;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background: #e2e6ff;
        }

        #resetBtn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #resetBtn:hover {
            background: #5568d8;
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>Tic-Tac-Toe</h1>

        <div id="status">Player X's Turn</div>

        <div class="board">

            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>

            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>

            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>

        </div>

        <button id="resetBtn" onclick="resetGame()">
            Reset Game
        </button>

    </div>

    <script>

        let board = ["", "", "", "", "", "", "", "", ""];

        let currentPlayer = "X";

        let gameActive = true;

        const winningPatterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];

        const cells = document.querySelectorAll(".cell");

        function makeMove(index) {

            if (!gameActive || board[index] !== "") {
                return;
            }

            board[index] = currentPlayer;

            cells[index].textContent = currentPlayer;

            checkWinner();
        }

        function checkWinner() {

            let winner = false;

            for (let pattern of winningPatterns) {

                const a = pattern[0];
                const b = pattern[1];
                const c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {

                    winner = true;
                    break;
                }
            }

            if (winner) {

                document.getElementById("status").textContent =
                    `🎉 Player ${currentPlayer} Wins!`;

                gameActive = false;

                return;
            }

            // Check for draw
            if (!board.includes("")) {

                document.getElementById("status").textContent =
                    "🤝 Game Draw!";

                gameActive = false;

                return;
            }

            // Change player
            currentPlayer =
                currentPlayer === "X" ? "O" : "X";

            document.getElementById("status").textContent =
                `Player ${currentPlayer}'s Turn`;
        }

        function resetGame() {

            board = ["", "", "", "", "", "", "", "", ""];

            currentPlayer = "X";

            gameActive = true;

            cells.forEach(function(cell) {
                cell.textContent = "";
            });

            document.getElementById("status").textContent =
                "Player X's Turn";
        }

    </script>

</body>
</html>
