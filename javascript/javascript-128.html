<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .product {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .product h3 {
            margin: 10px 0;
        }

        .price {
            color: #667eea;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            cursor: pointer;
            background: #667eea;
            color: white;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d8;
        }

        .cart {
            margin-top: 30px;
            padding: 20px;
            background: #f0f3ff;
            border-radius: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
        }

        .remove-btn {
            background: #dc3545;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }

        #emptyMessage {
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛒 Shopping Cart</h1>

    <div class="products">

        <div class="product">
            <h3>Laptop</h3>
            <p class="price">₹50,000</p>
            <button onclick="addToCart('Laptop', 50000)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p class="price">₹2,000</p>
            <button onclick="addToCart('Headphones', 2000)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>Keyboard</h3>
            <p class="price">₹1,500</p>
            <button onclick="addToCart('Keyboard', 1500)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>Mouse</h3>
            <p class="price">₹800</p>
            <button onclick="addToCart('Mouse', 800)">
                Add to Cart
            </button>
        </div>

    </div>

    <div class="cart">

        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <p id="emptyMessage">Your cart is empty.</p>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

    </div>

</div>

<script>

    let cart = [];

    function addToCart(name, price) {

        const existingItem = cart.find(
            item => item.name === name
        );

        if (existingItem) {
            existingItem.quantity++;
        } else {
            cart.push({
                name: name,
                price: price,
                quantity: 1
            });
        }

        displayCart();
    }

    function removeFromCart(index) {

        cart.splice(index, 1);

        displayCart();
    }

    function displayCart() {

        const cartItems =
            document.getElementById("cartItems");

        const emptyMessage =
            document.getElementById("emptyMessage");

        const totalElement =
            document.getElementById("total");

        cartItems.innerHTML = "";

        let total = 0;

        if (cart.length === 0) {

            emptyMessage.style.display = "block";

        } else {

            emptyMessage.style.display = "none";
        }

        cart.forEach(function(item, index) {

            const itemTotal =
                item.price * item.quantity;

            total += itemTotal;

            const div =
                document.createElement("div");

            div.className = "cart-item";

            div.innerHTML = `
                <span>
                    ${item.name}
                    × ${item.quantity}
                    - ₹${itemTotal}
                </span>

                <button
                    class="remove-btn"
                    onclick="removeFromCart(${index})">
                    Remove
                </button>
            `;

            cartItems.appendChild(div);
        });

        totalElement.textContent = total;
    }

</script>

</body>
</html>
