<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #noteInput {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        #addBtn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #addBtn:hover {
            background: #5568d8;
        }

        .notes {
            margin-top: 30px;
        }

        .note {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .note-text {
            white-space: pre-wrap;
            color: #333;
            margin-bottom: 12px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        #message {
            text-align: center;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Notes Application</h1>

    <textarea
        id="noteInput"
        placeholder="Write your note here..."
    ></textarea>

    <button id="addBtn" onclick="addNote()">
        Add Note
    </button>

    <div class="notes" id="notesContainer"></div>

    <div id="message">
        No notes available.
    </div>

</div>

<script>

    let notes = JSON.parse(
        localStorage.getItem("notes")
    ) || [];

    function saveNotes() {

        localStorage.setItem(
            "notes",
            JSON.stringify(notes)
        );
    }

    function addNote() {

        const noteInput =
            document.getElementById("noteInput");

        const text = noteInput.value.trim();

        if (text === "") {

            alert("Please write a note.");

            return;
        }

        const note = {
            id: Date.now(),
            text: text
        };

        notes.push(note);

        saveNotes();

        noteInput.value = "";

        displayNotes();
    }

    function deleteNote(id) {

        notes = notes.filter(function(note) {
            return note.id !== id;
        });

        saveNotes();

        displayNotes();
    }

    function displayNotes() {

        const container =
            document.getElementById("notesContainer");

        const message =
            document.getElementById("message");

        container.innerHTML = "";

        if (notes.length === 0) {

            message.textContent =
                "No notes available.";

            return;
        }

        message.textContent = "";

        notes.forEach(function(note) {

            const noteDiv =
                document.createElement("div");

            noteDiv.className = "note";

            const noteText =
                document.createElement("div");

            noteText.className = "note-text";

            noteText.textContent = note.text;

            const deleteButton =
                document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className = "delete-btn";

            deleteButton.onclick = function() {
                deleteNote(note.id);
            };

            noteDiv.appendChild(noteText);
            noteDiv.appendChild(deleteButton);

            container.appendChild(noteDiv);
        });
    }

    displayNotes();

</script>

</body>
</html>
