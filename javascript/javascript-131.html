<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #result {
            margin-top: 25px;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
            display: none;
        }

        #bmiValue {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        #category {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚖️ BMI Calculator</h1>

    <div class="input-group">
        <label for="weight">Weight (kg)</label>
        <input
            type="number"
            id="weight"
            placeholder="Enter your weight"
            min="1"
        >
    </div>

    <div class="input-group">
        <label for="height">Height (cm)</label>
        <input
            type="number"
            id="height"
            placeholder="Enter your height"
            min="1"
        >
    </div>

    <button onclick="calculateBMI()">
        Calculate BMI
    </button>

    <div id="error"></div>

    <div id="result">

        <div>Your BMI is</div>

        <div id="bmiValue"></div>

        <div id="category"></div>

    </div>

</div>

<script>

function calculateBMI() {

    const weight =
        parseFloat(document.getElementById("weight").value);

    const height =
        parseFloat(document.getElementById("height").value);

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    error.textContent = "";
    result.style.display = "none";

    // Validate input
    if (isNaN(weight) || isNaN(height)) {

        error.textContent =
            "Please enter both weight and height.";

        return;
    }

    if (weight <= 0 || height <= 0) {

        error.textContent =
            "Weight and height must be greater than zero.";

        return;
    }

    // Convert height from cm to meters
    const heightInMeters = height / 100;

    // BMI formula
    const bmi =
        weight / (heightInMeters * heightInMeters);

    let category;

    if (bmi < 18.5) {

        category = "Underweight";

    } else if (bmi < 25) {

        category = "Normal Weight";

    } else if (bmi < 30) {

        category = "Overweight";

    } else {

        category = "Obesity";
    }

    document.getElementById("bmiValue").textContent =
        bmi.toFixed(2);

    document.getElementById("category").textContent =
        category;

    result.style.display = "block";
}

</script>

</body>
</html>
