<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Text Content</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            width: 400px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
        }

        #text {
            font-size: 20px;
            margin: 25px 0;
            color: #333;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Change Text Content</h1>

        <p id="text">
            This is the original text.
        </p>

        <button onclick="changeText()">
            Change Text
        </button>

    </div>

    <script>

        function changeText() {

            document.getElementById("text").textContent =
                "The text has been changed using JavaScript!";

        }

    </script>

</body>
</html>
