<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replace HTML Element</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
        }

        #content {
            background: #f2f2f2;
            padding: 25px;
            margin: 25px 0;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            font-size: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Replace HTML Element</h1>

        <p id="content">
            This is the original paragraph.
        </p>

        <button onclick="replaceElement()">
            Replace Element
        </button>

    </div>

    <script>

        function replaceElement() {

            // Get the existing element
            const oldElement =
                document.getElementById("content");

            // Create a new element
            const newElement =
                document.createElement("h2");

            // Add content to the new element
            newElement.textContent =
                "This is the new heading!";

            // Add the same ID
            newElement.id = "content";

            // Replace old element with new element
            oldElement.replaceWith(newElement);
        }

    </script>

</body>
</html>
