<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Unordered List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            background: #f1f3ff;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            color: #333;
        }

        button {
            display: block;
            margin: 20px auto 0;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Dynamic Unordered List</h1>

        <div id="listContainer"></div>

        <button onclick="createList()">
            Create List
        </button>

    </div>

    <script>

        function createList() {

            const subjects = [
                "HTML",
                "CSS",
                "JavaScript",
                "Python",
                "Data Structures",
                "Database Management"
            ];

            const ul = document.createElement("ul");

            subjects.forEach(function(subject) {

                const li = document.createElement("li");

                li.textContent = subject;

                ul.appendChild(li);

            });

            const container =
                document.getElementById("listContainer");

            container.innerHTML = "";

            container.appendChild(ul);
        }

    </script>

</body>
</html>
