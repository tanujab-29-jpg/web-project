<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Ordered List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #764ba2;
        }

        ol {
            margin-top: 25px;
            padding-left: 30px;
        }

        li {
            padding: 10px;
            margin: 8px 0;
            background: #f1f3ff;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Dynamic Ordered List</h1>

        <div class="input-area">
            <input
                type="text"
                id="itemInput"
                placeholder="Enter an item"
            >

            <button onclick="addItem()">
                Add
            </button>
        </div>

        <ol id="itemList"></ol>

    </div>

    <script>

        function addItem() {

            const input =
                document.getElementById("itemInput");

            const value = input.value.trim();

            if (value === "") {
                alert("Please enter an item.");
                return;
            }

            const li = document.createElement("li");

            li.textContent = value;

            document
                .getElementById("itemList")
                .appendChild(li);

            input.value = "";

            input.focus();
        }

        document
            .getElementById("itemInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    addItem();
                }

            });

    </script>

</body>
</html>
