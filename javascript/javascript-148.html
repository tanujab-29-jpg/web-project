<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Table Row</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 800px;
            max-width: 90%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f3f3ff;
        }

        .delete-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #e74c3c;
            color: white;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .message {
            text-align: center;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Table</h1>

    <table>

        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTable">

            <tr>
                <td>101</td>
                <td>Anjali</td>
                <td>B.Tech CSE</td>
                <td>85</td>
                <td>
                    <button class="delete-btn" onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            </tr>

            <tr>
                <td>102</td>
                <td>Rahul</td>
                <td>B.Tech CSE</td>
                <td>91</td>
                <td>
                    <button class="delete-btn" onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            </tr>

            <tr>
                <td>103</td>
                <td>Priya</td>
                <td>B.Tech CSE</td>
                <td>78</td>
                <td>
                    <button class="delete-btn" onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            </tr>

            <tr>
                <td>104</td>
                <td>Arun</td>
                <td>B.Tech CSE</td>
                <td>88</td>
                <td>
                    <button class="delete-btn" onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            </tr>

        </tbody>

    </table>

    <p class="message" id="message"></p>

</div>

<script>

function deleteRow(button) {

    const row = button.parentElement.parentElement;

    row.remove();

    const table = document.getElementById("studentTable");

    if (table.children.length === 0) {
        document.getElementById("message").textContent =
            "No students remaining in the table.";
    }
}

</script>

</body>
</html>
