<!DOCTYPE html>
<html>
<head>
    <title>Searchable Table</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
        input {
            width: 95%;
            padding: 12px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Search Students</h1>

    <input type="text" id="search" placeholder="Search student..."
           onkeyup="searchTable()">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody id="studentTable">
            <tr>
                <td>Anjali</td>
                <td>CSE</td>
                <td>85</td>
            </tr>
            <tr>
                <td>Rahul</td>
                <td>ECE</td>
                <td>91</td>
            </tr>
            <tr>
                <td>Priya</td>
                <td>CSE</td>
                <td>78</td>
            </tr>
            <tr>
                <td>Arun</td>
                <td>IT</td>
                <td>88</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function searchTable() {
    const search =
        document.getElementById("search").value.toLowerCase();

    const rows =
        document.querySelectorAll("#studentTable tr");

    rows.forEach(function(row) {
        const text = row.textContent.toLowerCase();

        row.style.display =
            text.includes(search) ? "" : "none";
    });
}
</script>

</body>
</html>
