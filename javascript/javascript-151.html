<!DOCTYPE html>
<html>
<head>
    <title>Sort Table</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sort Student Records</h1>

    <button onclick="sortMarks()">Sort by Marks</button>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody id="tableBody">
            <tr><td>Anjali</td><td>85</td></tr>
            <tr><td>Rahul</td><td>91</td></tr>
            <tr><td>Priya</td><td>78</td></tr>
            <tr><td>Arun</td><td>88</td></tr>
        </tbody>
    </table>
</div>

<script>
let ascending = true;

function sortMarks() {
    const tbody = document.getElementById("tableBody");
    const rows = Array.from(tbody.rows);

    rows.sort(function(a, b) {
        const markA = Number(a.cells[1].textContent);
        const markB = Number(b.cells[1].textContent);

        return ascending
            ? markA - markB
            : markB - markA;
    });

    rows.forEach(row => tbody.appendChild(row));

    ascending = !ascending;
}
</script>

</body>
</html>
