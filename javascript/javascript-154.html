<!DOCTYPE html>
<html>
<head>
    <title>Dependent Dropdown</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 50px;
        }
        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
        }
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Location Selection</h1>

    <select id="country" onchange="loadStates()">
        <option value="">Select Country</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
    </select>

    <select id="state" onchange="loadCities()">
        <option value="">Select State</option>
    </select>

    <select id="city">
        <option value="">Select City</option>
    </select>

</div>

<script>
const data = {
    India: {
        TamilNadu: ["Chennai", "Coimbatore", "Madurai"],
        AndhraPradesh: ["Nellore", "Vijayawada", "Tirupati"]
    },
    USA: {
        California: ["Los Angeles", "San Francisco"],
        Texas: ["Houston", "Dallas"]
    }
};

function loadStates() {
    const country = document.getElementById("country").value;
    const state = document.getElementById("state");

    state.innerHTML = '<option value="">Select State</option>';

    document.getElementById("city").innerHTML =
        '<option value="">Select City</option>';

    if (country && data[country]) {
        Object.keys(data[country]).forEach(function(item) {
            const option = document.createElement("option");
            option.value = item;
            option.textContent = item;
            state.appendChild(option);
        });
    }
}

function loadCities() {
    const country = document.getElementById("country").value;
    const state = document.getElementById("state").value;
    const city = document.getElementById("city");

    city.innerHTML = '<option value="">Select City</option>';

    if (country && state) {
        data[country][state].forEach(function(item) {
            const option = document.createElement("option");
            option.value = item;
            option.textContent = item;
            city.appendChild(option);
        });
    }
}
</script>

</body>
</html>
