<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Image Gallery</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: white;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }
        .card {
            background: white;
            padding: 10px;
            border-radius: 12px;
        }
        img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        p {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Dynamic Image Gallery</h1>

<div class="gallery" id="gallery"></div>

<script>
const images = [
    {
        title: "Nature",
        src: "https://picsum.photos/400/250?random=1"
    },
    {
        title: "Mountain",
        src: "https://picsum.photos/400/250?random=2"
    },
    {
        title: "Ocean",
        src: "https://picsum.photos/400/250?random=3"
    },
    {
        title: "Forest",
        src: "https://picsum.photos/400/250?random=4"
    },
    {
        title: "City",
        src: "https://picsum.photos/400/250?random=5"
    },
    {
        title: "Travel",
        src: "https://picsum.photos/400/250?random=6"
    }
];

const gallery = document.getElementById("gallery");

images.forEach(function(image) {

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = image.src;
    img.alt = image.title;

    const title = document.createElement("p");
    title.textContent = image.title;

    card.appendChild(img);
    card.appendChild(title);

    gallery.appendChild(card);
});
</script>

</body>
</html>
