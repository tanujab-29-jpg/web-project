<!DOCTYPE html>
<html>
<head>
    <title>Image Slideshow</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 40px;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
        }
        img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }
        button {
            padding: 12px 25px;
            margin: 15px 5px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Image Slideshow</h1>

    <img id="slide">

    <br>

    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>

</div>

<script>
const images = [
    "https://picsum.photos/600/350?random=10",
    "https://picsum.photos/600/350?random=11",
    "https://picsum.photos/600/350?random=12",
    "https://picsum.photos/600/350?random=13"
];

let index = 0;

const slide = document.getElementById("slide");

function displayImage() {
    slide.src = images[index];
}

function next() {
    index++;

    if (index >= images.length) {
        index = 0;
    }

    displayImage();
}

function previous() {
    index--;

    if (index < 0) {
        index = images.length - 1;
    }

    displayImage();
}

displayImage();

setInterval(next, 3000);
</script>

</body>
</html>
