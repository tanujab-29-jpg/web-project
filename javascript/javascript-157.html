<!DOCTYPE html>
<html>
<head>
    <title>Show Hide Password</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 60px;
            text-align: center;
        }
        .box {
            background: white;
            padding: 30px;
            max-width: 400px;
            margin: auto;
            border-radius: 20px;
        }
        input {
            padding: 12px;
            width: 70%;
        }
        button {
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Password</h1>

    <input type="password" id="password">

    <button onclick="togglePassword()">
        Show
    </button>
</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = event.target;

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}
</script>

</body>
</html>
