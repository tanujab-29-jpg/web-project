<!DOCTYPE html>
<html>
<head>
    <title>Tabs Interface</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
        .tabs {
            display: flex;
            gap: 5px;
        }
        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            background: #ddd;
            cursor: pointer;
        }
        .tabs button.active {
            background: #667eea;
            color: white;
        }
        .content {
            display: none;
            padding: 25px;
        }
        .content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Courses</h1>

    <div class="tabs">
        <button onclick="showTab('html', this)">HTML</button>
        <button onclick="showTab('css', this)">CSS</button>
        <button onclick="showTab('js', this)">JavaScript</button>
    </div>

    <div id="html" class="content">
        <h2>HTML</h2>
        <p>HTML creates the structure of webpages.</p>
    </div>

    <div id="css" class="content">
        <h2>CSS</h2>
        <p>CSS is used for styling webpages.</p>
    </div>

    <div id="js" class="content">
        <h2>JavaScript</h2>
        <p>JavaScript adds interactivity.</p>
    </div>

</div>

<script>
function showTab(id, button) {

    document.querySelectorAll(".content")
        .forEach(item => item.classList.remove("active"));

    document.querySelectorAll(".tabs button")
        .forEach(item => item.classList.remove("active"));

    document.getElementById(id).classList.add("active");

    button.classList.add("active");
}

document.querySelector(".tabs button").click();
</script>

</body>
</html>
