<!DOCTYPE html>
<html>
<head>
    <title>Arrow Functions</title>
</head>
<body>

<h2>Arrow Function</h2>

<script>
    const add = (a, b) => a + b;

    const multiply = (a, b) => a * b;

    document.write("Addition = " + add(10, 20) + "<br>");
    document.write("Multiplication = " + multiply(10, 20));
</script>

</body>
</html>
