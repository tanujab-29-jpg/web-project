<!DOCTYPE html>
<html>
<head>
    <title>Accordion</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
        .question {
            width: 100%;
            padding: 15px;
            text-align: left;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            margin-top: 5px;
        }
        .answer {
            display: none;
            padding: 15px;
            background: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>FAQ Accordion</h1>

    <button class="question" onclick="toggleAnswer(this)">
        What is HTML?
    </button>
    <div class="answer">
        HTML is used to create webpage structure.
    </div>

    <button class="question" onclick="toggleAnswer(this)">
        What is CSS?
    </button>
    <div class="answer">
        CSS is used to style webpages.
    </div>

    <button class="question" onclick="toggleAnswer(this)">
        What is JavaScript?
    </button>
    <div class="answer">
        JavaScript makes webpages interactive.
    </div>

</div>

<script>
function toggleAnswer(button) {
    const answer = button.nextElementSibling;

    if (answer.style.display === "block") {
        answer.style.display = "none";
    } else {
        answer.style.display = "block";
    }
}
</script>

</body>
</html>
