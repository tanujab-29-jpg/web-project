<!DOCTYPE html>
<html>
<head>
    <title>String Methods</title>
</head>
<body>

<h2>String Methods</h2>

<script>
    let text = "JavaScript Programming";

    document.write("Original: " + text + "<br>");
    document.write("Length: " + text.length + "<br>");
    document.write("Uppercase: " + text.toUpperCase() + "<br>");
    document.write("Lowercase: " + text.toLowerCase() + "<br>");
    document.write("Character at 0: " + text.charAt(0) + "<br>");
    document.write("Includes JavaScript: " +
        text.includes("JavaScript") + "<br>");
    document.write("Slice: " + text.slice(0, 10));
</script>

</body>
</html>
