<!DOCTYPE html>
<html>
<head><title>keydown Event</title></head>
<body>

<h1>keydown Event</h1>

<input id="input" placeholder="Press a key">

<p id="msg"></p>

<script>
document.getElementById("input").addEventListener("keydown",function(event){
    document.getElementById("msg").textContent =
        "Key pressed: " + event.key;
});
</script>

</body>
</html>
