<!DOCTYPE html>
<html>
<head>
    <title>Array Methods</title>
</head>
<body>

<h2>Array Methods</h2>

<script>
    let fruits = ["Apple", "Banana", "Mango"];

    document.write("Original: " + fruits + "<br>");

    fruits.push("Orange");

    document.write("After push: " + fruits + "<br>");

    fruits.pop();

    document.write("After pop: " + fruits + "<br>");

    fruits.unshift("Grapes");

    document.write("After unshift: " + fruits + "<br>");

    fruits.shift();

    document.write("After shift: " + fruits + "<br>");

    document.write("Length: " + fruits.length);
</script>

</body>
</html>
