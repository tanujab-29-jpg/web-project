<!DOCTYPE html>
<html>
<head>
    <title>Date and Math Objects</title>
</head>
<body>

<h2>Date and Math Objects</h2>

<script>

    // Date Object
    let today = new Date();

    document.write("<h3>Date Object</h3>");

    document.write("Current Date: " + today + "<br>");
    document.write("Year: " + today.getFullYear() + "<br>");
    document.write("Month: " + (today.getMonth() + 1) + "<br>");
    document.write("Day: " + today.getDate() + "<br>");

    // Math Object
    document.write("<h3>Math Object</h3>");

    document.write("Square Root of 25: " + Math.sqrt(25) + "<br>");
    document.write("Power: " + Math.pow(2, 3) + "<br>");
    document.write("Random Number: " + Math.random() + "<br>");
    document.write("Maximum: " + Math.max(10, 50, 30) + "<br>");
    document.write("Minimum: " + Math.min(10, 50, 30));

</script>

</body>
</html>
