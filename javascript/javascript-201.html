<!DOCTYPE html>
<html>
<head><title>Name Validation</title></head>
<body>

<h1>Name Validation</h1>

<input id="name" placeholder="Enter name">
<button onclick="validate()">Validate</button>

<p id="msg"></p>

<script>
function validate(){

    const name=document.getElementById("name").value;

    if(/^[A-Za-z ]+$/.test(name))
        msg.textContent="Valid name";
    else
        msg.textContent="Name must contain alphabets only";
}
</script>

</body>
