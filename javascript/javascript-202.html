<!DOCTYPE html>
<html>
<head><title>Age Validation</title></head>
<body>

<h1>Age Validation</h1>

<input id="age" type="number">
<button onclick="validateAge()">Validate</button>

<p id="msg"></p>

<script>
function validateAge(){

    const age=Number(document.getElementById("age").value);

    if(age>=18 && age<=100)
        msg.textContent="Valid age";
    else
        msg.textContent="Age must be between 18 and 100";
}
</script>

</body>
</html>
