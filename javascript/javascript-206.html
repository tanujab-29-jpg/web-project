<!DOCTYPE html>
<html>
<head><title>Strong Password</title></head>
<body>

<h1>Strong Password Validator</h1>

<input id="password" type="password">
<button onclick="validate()">Validate</button>

<p id="msg"></p>

<script>
function validate(){

    const p=document.getElementById("password").value;

    const strong =
        p.length>=8 &&
        /[A-Z]/.test(p) &&
        /[a-z]/.test(p) &&
        /\d/.test(p) &&
        /[^A-Za-z0-9]/.test(p);

    msg.textContent=strong?
        "Strong password":
        "Use 8+ characters, uppercase, lowercase, number and symbol.";
}
</script>

</body>
</html>
