<!DOCTYPE html>
<html>
<head><title>Date Validation</title></head>
<body>

<h1>Date of Birth</h1>

<input id="dob" type="date">
<button onclick="validate()">Validate</button>

<p id="msg"></p>

<script>
function validate(){

    const dob=document.getElementById("dob").value;

    if(dob)
        msg.textContent="Date of birth selected";
    else
        msg.textContent="Please select date of birth";
}
</script>

</body>
</html>
