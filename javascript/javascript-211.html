<!DOCTYPE html>
<html>
<head><title>Checkbox Validation</title></head>
<body>

<h1>Terms and Conditions</h1>

<label>
<input type="checkbox" id="terms">
I accept the terms
</label>

<br><br>

<button onclick="validate()">Submit</button>

<p id="msg"></p>

<script>
function validate(){

    msg.textContent=document.getElementById("terms").checked?
        "Accepted":
        "Please accept the terms";
}
</script>

</body>
</html>
