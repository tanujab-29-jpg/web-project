<!DOCTYPE html>
<html>
<head><title>Dropdown Validation</title></head>
<body>

<h1>Select Course</h1>

<select id="course">
<option value="">Select Course</option>
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
</select>

<button onclick="validate()">Submit</button>

<p id="msg"></p>

<script>
function validate(){

    const course=document.getElementById("course").value;

    msg.textContent=course?
        "Selected: "+course:
        "Please select a course";
}
</script>

</body>
</html>
