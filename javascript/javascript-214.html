<!DOCTYPE html>
<html>
<head><title>Required Fields</title></head>
<body>

<h1>Required Field Validation</h1>

<form id="form">

<input id="name" required placeholder="Name"><br><br>
<input id="email" required placeholder="Email"><br><br>
<input id="phone" required placeholder="Phone"><br><br>

<button>Submit</button>

</form>

<p id="msg"></p>

<script>
document.getElementById("form").addEventListener("submit",function(e){

    e.preventDefault();

    if(this.checkValidity())
        msg.textContent="All required fields are valid.";
});
</script>

</body>
</html>
