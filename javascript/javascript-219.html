<!DOCTYPE html>
<html>
<head><title>Email Regex</title></head>
<body>

<input id="email" placeholder="Email">
<button onclick="validate()">Validate</button>

<p id="msg"></p>

<script>
function validate(){

    const email=document.getElementById("email").value;

    const pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    msg.textContent=pattern.test(email)?
        "Valid email":
        "Invalid email";
}
</script>

</body>
</html>
