<!DOCTYPE html>
<html>
<head>
<title>Password Strength</title>
<style>
#bar{
    width:300px;
    height:20px;
    background:#ddd;
}
#strength{
    height:100%;
    width:0;
}
</style>
</head>
<body>

<h1>Password Strength Meter</h1>

<input id="password" type="password">

<div id="bar">
    <div id="strength"></div>
</div>

<p id="msg"></p>

<script>
document.getElementById("password").addEventListener("input",function(){

    const p=this.value;
    let score=0;

    if(p.length>=8) score++;
    if(/[A-Z]/.test(p)) score++;
    if(/[a-z]/.test(p)) score++;
    if(/\d/.test(p)) score++;
    if(/[^A-Za-z0-9]/.test(p)) score++;

    const width=score*20;

    document.getElementById("strength").style.width=width+"%";

    msg.textContent=
        score<2?"Weak":
        score<4?"Medium":"Strong";
});
</script>

</body>
</html>
