<!DOCTYPE html>
<html>
<head><title>Job Application</title></head>
<body>

<h1>Job Application</h1>

<form id="form">

<input id="name" required placeholder="Name"><br><br>
<input id="email" type="email" required placeholder="Email"><br><br>
<input id="experience" type="number" required placeholder="Experience in years"><br><br>

<select id="role" required>
<option value="">Select Role</option>
<option>Developer</option>
<option>Designer</option>
<option>Tester</option>
</select><br><br>

<textarea id="skills" required placeholder="Skills"></textarea><br><br>

<button>Apply</button>

</form>

<p id="msg"></p>

<script>
document.getElementById("form").addEventListener("submit",function(e){

    e.preventDefault();

    const experience=Number(
        document.getElementById("experience").value
    );

    if(experience<0){
        msg.textContent="Experience cannot be negative";
        return;
    }

    msg.textContent="Job application submitted successfully!";
});
</script>

</body>
</html>
