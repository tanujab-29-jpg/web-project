<!DOCTYPE html>
<html>
<head><title>Shopping Order</title></head>
<body>

<h1>Shopping Order</h1>

<select id="product">
<option value="500">Bag - ₹500</option>
<option value="1000">Shoes - ₹1000</option>
<option value="1500">Watch - ₹1500</option>
<option value="2000">Headphones - ₹2000</option>
</select>

<input id="quantity" type="number" value="1" min="1">

<button onclick="calculate()">Calculate</button>

<h2 id="result"></h2>

<script>
function calculate(){

    const price=Number(document.getElementById("product").value);
    const quantity=Number(document.getElementById("quantity").value);

    const total=price*quantity;

    document.getElementById("result").textContent=
        "Total Price: ₹"+total;
}
</script>

</body>
</html>
