<!DOCTYPE html>
<html>
<head>
    <title>Button Click Event</title>
</head>
<body>

<h2>Button Click Event</h2>

<button id="myButton">Click Me</button>

<p id="message"></p>

<script>
    document.getElementById("myButton").onclick = function() {
        document.getElementById("message").innerHTML =
            "Button was clicked!";
    };
</script>

</body>
</html>
