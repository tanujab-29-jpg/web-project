<!DOCTYPE html>
<html>
<head>
<title>setInterval</title>
</head>
<body>

<h1>setInterval()</h1>

<h2 id="count">0</h2>

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>

<script>
let count = 0;
let timer;

function start() {
    timer = setInterval(function() {
        count++;
        document.getElementById("count").textContent = count;
    }, 1000);
}

function stop() {
    clearInterval(timer);
}
</script>

</body>
</html>
