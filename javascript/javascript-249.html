<!DOCTYPE html>
<html>
<head>
<title>History Object</title>
</head>
<body>

<h1>History Object</h1>

<p>History Length:
<span id="length"></span></p>

<button onclick="goBack()">Back</button>

<script>
document.getElementById("length").textContent =
    history.length;

function goBack() {
    history.back();
}
</script>

</body>
</html>
