<!DOCTYPE html>
<html>
<head>
<title>Navigator Object</title>
</head>
<body>

<h1>Navigator Object</h1>

<p id="output"></p>

<script>
document.getElementById("output").innerHTML =
    "Browser: " + navigator.userAgent + "<br>" +
    "Language: " + navigator.language + "<br>" +
    "Online: " + navigator.onLine;
</script>

</body>
</html>
