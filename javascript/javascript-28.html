<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #07111f;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .calculator {
            max-width: 400px;
            margin: auto;
            background: #101f38;
            padding: 30px;
            border-radius: 15px;
        }

        input,
        select,
        button {
            padding: 12px;
            margin: 8px;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #4f8cff;
            color: white;
            cursor: pointer;
        }

        #result {
            font-size: 25px;
            color: #ff5ca8;
        }
    </style>
</head>
<body>

<div class="calculator">

    <h1>Calculator</h1>

    <input type="number" id="num1" placeholder="First Number">

    <input type="number" id="num2" placeholder="Second Number">

    <br>

    <select id="operator">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="*">Multiplication (*)</option>
        <option value="/">Division (/)</option>
    </select>

    <br>

    <button onclick="calculate()">Calculate</button>

    <h2 id="result"></h2>

</div>

<script>
    function calculate() {

        let num1 = Number(document.getElementById("num1").value);
        let num2 = Number(document.getElementById("num2").value);
        let operator = document.getElementById("operator").value;

        let result;

        if (operator === "+") {
            result = num1 + num2;
        } else if (operator === "-") {
            result = num1 - num2;
        } else if (operator === "*") {
            result = num1 * num2;
        } else if (operator === "/") {

            if (num2 === 0) {
                result = "Cannot divide by zero";
            } else {
                result = num1 / num2;
            }
        }

        document.getElementById("result").innerHTML =
            "Result = " + result;
    }
</script>

</body>
</html>
