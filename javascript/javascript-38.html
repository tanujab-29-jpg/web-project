<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 38 - ES6 Features</title>
</head>
<body>

<h2>ES6 Features</h2>

<script>
    let name = "Tanuja";
    const course = "B.Tech CSE";

    let message = `Name: ${name}<br>Course: ${course}`;

    let student = {
        age: 20,
        college: "Sai University"
    };

    let { age, college } = student;

    document.write(message + "<br>");
    document.write("Age: " + age + "<br>");
    document.write("College: " + college);
</script>

</body>
</html>
