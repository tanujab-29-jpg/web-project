<!DOCTYPE html>
<html>
<head>
    <title>Spread and Rest Operators</title>
</head>
<body>

<h2>Spread and Rest Operators</h2>

<script>
    // Spread Operator
    let numbers1 = [10, 20, 30];
    let numbers2 = [40, 50, 60];

    let combined = [...numbers1, ...numbers2];

    document.write("Spread Result: " + combined + "<br><br>");

    // Rest Operator
    function add(...numbers) {

        let sum = 0;

        for (let number of numbers) {
            sum += number;
        }

        return sum;
    }

    document.write("Rest Result: " + add(10, 20, 30, 40));
</script>

</body>
</html>
