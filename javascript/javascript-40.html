<!DOCTYPE html>
<html>
<head>
    <title>Classes and Objects</title>
</head>
<body>

<h2>Classes and Objects</h2>

<script>

    class Student {

        constructor(name, age, course) {
            this.name = name;
            this.age = age;
            this.course = course;
        }

        display() {
            return `
                Name: ${this.name}<br>
                Age: ${this.age}<br>
                Course: ${this.course}
            `;
        }
    }

    let student1 = new Student(
        "Tanuja",
        20,
        "B.Tech CSE"
    );

    document.write(student1.display());

</script>

</body>
</html>
