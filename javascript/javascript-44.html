<!DOCTYPE html>
<html>
<head>
    <title>Display API Data</title>

    <style>
        body {
            font-family: Arial;
            background: #07111f;
            color: white;
            padding: 30px;
        }

        .user {
            background: #101f38;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
        }

        button {
            padding: 12px 20px;
            background: #4f8cff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>API User Data</h2>

<button onclick="loadUsers()">Load Users</button>

<div id="users"></div>

<script>

    async function loadUsers() {

        let response = await fetch(
            "https://jsonplaceholder.typicode.com/users"
        );

        let users = await response.json();

        let output = "";

        users.forEach(function(user) {

            output += `
                <div class="user">
                    <h3>${user.name}</h3>
                    <p>Email: ${user.email}</p>
                    <p>Phone: ${user.phone}</p>
                    <p>City: ${user.address.city}</p>
                </div>
            `;

        });

        document.getElementById("users").innerHTML =
            output;
    }

</script>

</body>
</html>
