<!DOCTYPE html>
<html>
<head>
    <title>Interactive JavaScript Website</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial;
            background: #07111f;
            color: white;
        }

        header {
            background: #101f38;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #4f8cff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        section {
            padding: 70px 7%;
            text-align: center;
        }

        .hero {
            min-height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h2 {
            font-size: 50px;
            color: #4f8cff;
        }

        .hero span {
            color: #ff5ca8;
        }

        button {
            padding: 13px 25px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            background: #4f8cff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #ff5ca8;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: #101f38;
            padding: 30px;
            width: 250px;
            border-radius: 15px;
        }

        #message {
            margin-top: 20px;
            color: #ff5ca8;
            font-size: 20px;
        }

        footer {
            background: #101f38;
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            .hero h2 {
                font-size: 35px;
            }

        }

    </style>
</head>

<body>

<header>

    <h1>CodeSpace</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

</header>


<section class="hero" id="home">

    <h2>
        Welcome to <span>CodeSpace</span>
    </h2>

    <p>
        Interactive JavaScript Website
    </p>

    <button onclick="changeMessage()">
        Click Me
    </button>

    <p id="message"></p>

</section>


<section id="services">

    <h2>Our Services</h2>

    <br>

    <div class="cards">

        <div class="card">
            <h3>Web Design</h3>
            <p>Modern responsive websites.</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Interactive web applications.</p>
        </div>

        <div class="card">
            <h3>Development</h3>
            <p>Modern web development.</p>
        </div>

    </div>

</section>


<section id="contact">

    <h2>Contact</h2>

    <p>Email: example@gmail.com</p>

    <button onclick="showContact()">
        Show Contact Message
    </button>

    <p id="contactMessage"></p>

</section>


<footer>

    <p>© 2026 CodeSpace</p>

</footer>


<script>

    function changeMessage() {

        document.getElementById("message").innerHTML =
            "JavaScript is working successfully! 🚀";
    }

    function showContact() {

        document.getElementById("contactMessage").innerHTML =
            "Thank you for visiting our website!";
    }

</script>

</body>
</html>
