<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>
</head>
<body>
    <h2>Armstrong Number</h2>

    <script>
        let num = 153;
        let original = num;
        let digits = num.toString().length;
        let sum = 0;

        while (num > 0) {
            let digit = num % 10;
            sum += Math.pow(digit, digits);
            num = Math.floor(num / 10);
        }

        if (sum === original) {
            document.write(original + " is an Armstrong number.");
        } else {
            document.write(original + " is not an Armstrong number.");
        }
    </script>
</body>
</html>
