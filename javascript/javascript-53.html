<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>
    <h2>Multiplication Table</h2>

    <script>
        let num = 7;

        for (let i = 1; i <= 10; i++) {
            document.write(num + " × " + i + " = " + (num * i) + "<br>");
        }
    </script>
</body>
</html>
