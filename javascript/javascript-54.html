<!DOCTYPE html>
<html>
<head>
    <title>Power</title>
</head>
<body>
    <h2>Power of a Number</h2>

    <script>
        let base = 2;
        let exponent = 5;

        let result = Math.pow(base, exponent);

        document.write(base + " raised to the power " + exponent + " = " + result);
    </script>
</body>
</html>
