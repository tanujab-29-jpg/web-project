<!DOCTYPE html>
<html>
<head>
    <title>Count Digits</title>
</head>
<body>
    <h2>Number of Digits</h2>

    <script>
        let num = 123456;
        let count = Math.abs(num).toString().length;

        document.write("Number: " + num + "<br>");
        document.write("Number of digits: " + count);
    </script>
</body>
</html>
