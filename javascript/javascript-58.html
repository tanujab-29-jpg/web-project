<!DOCTYPE html>
<html>
<head>
    <title>Merge Arrays</title>
</head>
<body>
    <h2>Merge Two Arrays</h2>

    <script>
        let arr1 = [1, 2, 3, 4];
        let arr2 = [5, 6, 7, 8];

        let mergedArray = [...arr1, ...arr2];

        document.write("Array 1: " + arr1.join(", ") + "<br>");
        document.write("Array 2: " + arr2.join(", ") + "<br>");
        document.write("Merged Array: " + mergedArray.join(", "));
    </script>
</body>
</html>
