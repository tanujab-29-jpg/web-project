<!DOCTYPE html>
<html>
<head>
    <title>Common Elements</title>
</head>
<body>
    <h2>Common Elements in Two Arrays</h2>

    <script>
        let arr1 = [1, 2, 3, 4, 5];
        let arr2 = [3, 4, 5, 6, 7];

        let set2 = new Set(arr2);

        let common = arr1.filter(value => set2.has(value));

        document.write("Array 1: " + arr1.join(", ") + "<br>");
        document.write("Array 2: " + arr2.join(", ") + "<br>");
        document.write("Common elements: " + common.join(", "));
    </script>
</body>
</html>
