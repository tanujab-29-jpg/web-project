<!DOCTYPE html>
<html>
<head>
    <title>Reverse String</title>
</head>
<body>
    <h2>Reverse a String</h2>

    <script>
        let str = "JavaScript";

        let reversed = str.split("").reverse().join("");

        document.write("Original string: " + str + "<br>");
        document.write("Reversed string: " + reversed);
    </script>
</body>
</html>
