<!DOCTYPE html>
<html>
<head>
    <title>Word Count</title>
</head>
<body>
    <h2>Count Number of Words</h2>

    <script>
        let str = "JavaScript is easy to learn";

        let words = str.trim() === "" ? [] : str.trim().split(/\s+/);

        document.write("String: " + str + "<br>");
        document.write("Number of words: " + words.length);
    </script>
</body>
</html>
