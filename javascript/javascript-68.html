<!DOCTYPE html>
<html>
<head>
    <title>68 - Onclick Event</title>
</head>
<body>

<h2>Onclick Event</h2>

<button onclick="showMessage()">Click Me</button>

<p id="result"></p>

<script>
function showMessage() {
    document.getElementById("result").innerHTML =
        "Button was clicked!";
}
</script>

</body>
</html>
