<!DOCTYPE html>
<html>
<head>
    <title>69 - Double Click Event</title>
</head>
<body>

<h2>Double Click Event</h2>

<button ondblclick="doubleClick()">Double Click Me</button>

<p id="result"></p>

<script>
function doubleClick() {
    document.getElementById("result").innerHTML =
        "Button was double-clicked!";
}
</script>

</body>
</html>
