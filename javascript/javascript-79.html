<!DOCTYPE html>
<html>
<head>
    <title>79 - Background Color</title>
</head>
<body>

<h2>Change Background Color</h2>

<button id="btn">Change Color</button>

<script>
document.getElementById("btn").addEventListener("click", function() {
    document.body.style.backgroundColor = "lightblue";
});
</script>

</body>
</html>
