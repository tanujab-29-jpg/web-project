<!DOCTYPE html>
<html>
<head>
    <title>85 - Event Bubbling</title>
</head>
<body>

<div id="parent" style="padding:30px; background:lightblue;">
    Parent
    <button id="child">Child Button</button>
</div>

<p id="result"></p>

<script>
document.getElementById("parent").addEventListener("click", function() {
    document.getElementById("result").innerHTML =
        "Parent event executed due to event bubbling.";
});
</script>

</body>
</html>
