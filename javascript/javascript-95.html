<!DOCTYPE html>
<html>
<head>
    <title>95 - Double Click</title>
</head>
<body>

<h2>Double-Click Example</h2>

<button id="button">Double Click Me</button>

<p id="result"></p>

<script>
document.getElementById("button").addEventListener("dblclick", function() {

    document.getElementById("result").innerHTML =
        "Double-click event executed!";

});
</script>

</body>
</html>
