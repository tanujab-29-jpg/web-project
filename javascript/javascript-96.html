<!DOCTYPE html>
<html>
<head>
    <title>96 - Bubbling and Capturing</title>
</head>
<body>

<h2>Event Bubbling and Capturing</h2>

<div id="parent" style="padding:40px; background-color:lightblue;">

    Parent

    <br><br>

    <button id="child">Click Child</button>

</div>

<p id="result"></p>

<script>
let parent = document.getElementById("parent");
let child = document.getElementById("child");
let result = document.getElementById("result");

// Capturing phase
parent.addEventListener("click", function() {

    result.innerHTML +=
        "Parent - Capturing<br>";

}, true);

// Child event
child.addEventListener("click", function() {

    result.innerHTML +=
        "Child clicked<br>";

});

// Bubbling phase
parent.addEventListener("click", function() {

    result.innerHTML +=
        "Parent - Bubbling<br>";

});

</script>

</body>
</html>
