<!DOCTYPE html>
<html>
<head>
    <title>98 - Keyboard Game</title>

    <style>
        #game {
            width: 500px;
            height: 300px;
            border: 2px solid black;
            position: relative;
        }

        #player {
            width: 40px;
            height: 40px;
            background-color: blue;
            position: absolute;
            left: 0;
            top: 0;
        }
    </style>
</head>

<body>

<h2>Keyboard Controlled Game</h2>

<p>Use the arrow keys to move the box.</p>

<div id="game">
    <div id="player"></div>
</div>

<script>
let player = document.getElementById("player");

let x = 0;
let y = 0;
let speed = 10;

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        x += speed;
    }

    if (event.key === "ArrowLeft") {
        x -= speed;
    }

    if (event.key === "ArrowDown") {
        y += speed;
    }

    if (event.key === "ArrowUp") {
        y -= speed;
    }

    x = Math.max(0, Math.min(x, 460));
    y = Math.max(0, Math.min(y, 260));

    player.style.left = x + "px";
    player.style.top = y + "px";
});
</script>

</body>
</html>
